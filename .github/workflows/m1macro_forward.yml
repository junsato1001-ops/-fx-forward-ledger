name: m1macro-forward
# M1-MACRO-V1 forward issuance (Impl Part 1 §2.3.1, §3; Part 4 §3, §8). Active only on main (after the
# implementation freeze). compute refuses unless the running Code_SHA256 equals the freeze record.
on:
  schedule:
    - cron: "40 15,17 * * *"          # 00:40 / 02:40 JST: CFTC pre-T_info snapshots
  workflow_run:
    workflows: [forward-ledger]        # after S0 issuance + Storage Verification Gate
    types: [completed]
permissions:
  contents: write
concurrency:
  group: m1macro-forward
  cancel-in-progress: false
env:
  PRIVATE_REPO: junsato1001-ops/fx-ledger-private-raw
jobs:
  cftc_snapshot:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - name: Fetch inside pinned image
        run: |
          set -eu; mkdir -p stage
          DIG=$(cat env/IMAGE_DIGEST); docker pull -q "$DIG" > /dev/null
          docker run --rm -v "$PWD":/w -w /w -e TZ=UTC -e LC_ALL=C.UTF-8 -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT "$DIG" sh -c '
            pip install -q --require-hashes -r env/requirements.lock && python -I m1macro/forward_run.py cftc-snapshot stage'
      - name: Commit snapshot (public, append-only)
        run: python3 -I m1macro/forward_commit.py commit-data stage
  issue:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - name: Fetch sources inside pinned image
        run: |
          set -eu; mkdir -p stage
          DIG=$(cat env/IMAGE_DIGEST); docker pull -q "$DIG" > /dev/null
          docker run --rm -v "$PWD":/w -w /w -e TZ=UTC -e LC_ALL=C.UTF-8 -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT "$DIG" sh -c '
            pip install -q --require-hashes -r env/requirements.lock && python -I m1macro/forward_run.py fetch stage'
      - name: Treasury raw -> private storage, fresh-clone readback (token never printed)
        env: { TOKEN: "${{ secrets.PRIVATE_RAW_TOKEN }}" }
        run: |
          set -eu
          if [ -d stage/private/m1macro_forward ]; then
            git clone -q "https://x-access-token:${TOKEN}@github.com/${PRIVATE_REPO}.git" priv 2>/dev/null
            cp -r stage/private/m1macro_forward priv/
            git -C priv add m1macro_forward
            git -C priv -c user.name=junsato1001-ops -c user.email=junsato1001-ops@users.noreply.github.com commit -q -m "M1-MACRO forward Treasury raw (run ${GITHUB_RUN_ID})"
            for i in 1 2 3 4 5; do git -C priv push -q origin HEAD:main 2>/dev/null && break; git -C priv pull -q --rebase origin main 2>/dev/null; done
            git -C priv rev-parse HEAD > stage/private_commit.txt; rm -rf priv
            git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/${PRIVATE_REPO}.git" priv2 2>/dev/null
            (cd stage/private && find m1macro_forward -type f -exec sha256sum {} \;) | (cd priv2 && sha256sum -c --quiet -)
            rm -rf priv2
          fi
          git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/${PRIVATE_REPO}.git" privdev 2>/dev/null
      - name: Commit source data (public raw + manifests)
        run: python3 -I m1macro/forward_commit.py commit-data stage
      - name: Compute inside pinned image (no git, no token)
        run: |
          set -eu
          DIG=$(cat env/IMAGE_DIGEST)
          docker run --rm -v "$PWD":/w -w /w -e PYTHONHASHSEED=0 -e TZ=UTC -e LC_ALL=C.UTF-8 -e OMP_NUM_THREADS=1 \
            -e OPENBLAS_NUM_THREADS=1 -e MKL_NUM_THREADS=1 -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT "$DIG" sh -c '
            pip install -q --require-hashes -r env/requirements.lock && python -I m1macro/forward_run.py compute stage privdev/m1macro_dev_snapshot'
          rm -rf privdev
      - name: Transaction (3 ledgers -> COMPLETE -> deadline audit)
        run: python3 -I m1macro/forward_commit.py commit-tx stage
