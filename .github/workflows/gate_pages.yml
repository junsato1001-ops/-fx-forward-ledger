name: gate-fetch-calendar-pages
on:
  workflow_dispatch:
    inputs:
      pages:
        description: "space-separated URLs (federalreserve.gov / boj.or.jp only)"
        required: true
      tag:
        description: "output folder name"
        required: true
permissions:
  contents: write
concurrency:
  group: gate-work
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf==5.1.0
      - name: Fetch and extract (metadata excerpts only)
        env:
          PAGES: ${{ inputs.pages }}
        run: python tools/gate/extract_pages.py "/tmp/out/${{ inputs.tag }}"
      - name: Commit to gate-work branch (not main)
        run: |
          git config user.name "fx-forward-ledger-bot"
          git config user.email "fx-forward-ledger-bot@users.noreply.github.com"
          git fetch origin gate-work || true
          if git rev-parse --verify origin/gate-work >/dev/null 2>&1; then git checkout -B gate-work origin/gate-work; else git checkout --orphan gate-work && git rm -rf . -q; fi
          mkdir -p calendar && rm -rf "calendar/${{ inputs.tag }}" && cp -r "/tmp/out/${{ inputs.tag }}" calendar/
          git add calendar && git commit -q -m "gate-work: calendar excerpts ${{ inputs.tag }} (run ${GITHUB_RUN_ID})" && git push origin gate-work
