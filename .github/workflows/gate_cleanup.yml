name: gate-cleanup-delete-gate-work
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete working branch gate-work (page excerpts); audit metadata stays on main
        run: |
          git push origin --delete gate-work || echo "gate-work not present"
