name: data-implementation-gate
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forward-ledger
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CFTC TFF metadata (names, codes, report dates only)
        run: python tools/gate/cftc_tff_metadata.py
      - name: Commit gate output
        run: |
          git config user.name "fx-forward-ledger-bot"
          git config user.email "fx-forward-ledger-bot@users.noreply.github.com"
          git add gate/
          git commit -m "gate: CFTC TFF JPY metadata (run ${GITHUB_RUN_ID})" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done; exit 1
